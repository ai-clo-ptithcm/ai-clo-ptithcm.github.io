name: V12.3 Assessment Attempt Once

on:
  push:
    branches: [v12.3-assessment-modular]
    paths: ['.github/workflows/v12.3-a3-attempt-once.yml']

permissions:
  contents: write

jobs:
  split-attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3-assessment-modular
          fetch-depth: 0

      - name: Extract Student Attempt factory
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment.js';
          let s=fs.readFileSync(p,'utf8');
          const start='  /* ============================================================\n   * SECTION 5/7 — Student attempt, resume, timer, autosave, submit and attempt result\n   * ============================================================ */';
          const end='  /* SECTION 6/7 moved to js/assessment/results.js */';
          const a=s.indexOf(start), b=s.indexOf(end);
          if(a<0||b<0||b<=a) throw new Error('Could not locate SECTION 5 boundaries');
          let body=s.slice(a+start.length,b);
          if(!body.includes('async function studentExamList')) throw new Error('studentExamList missing');
          if(!body.includes('async function openStudentAttemptResult')) throw new Error('openStudentAttemptResult missing');
          if(!body.includes('function clearLiveTimer')) throw new Error('clearLiveTimer missing');

          // Student Attempt owns its own timer state.
          body=body.replace(/runtime\.liveTimer/g,'liveTimer');
          body='      let liveTimer = null;\n'+body;
          body=body.replace(/^  /gm,'      ');

          const module=`/* AI-CLO PTITHCM V12.3 — Student Attempt module. */\n(() => {\n  "use strict";\n  window.AICLO_ASSESSMENT_MODULES = window.AICLO_ASSESSMENT_MODULES || {};\n  window.AICLO_ASSESSMENT_MODULES.createStudentAttemptModule = function createStudentAttemptModule(ctx) {\n    const { db, state, fetchExams, statusMeta, escapeHtml, qs, qsa, ask, showError, notify, openDrawer, replaceDrawer } = ctx;\n    if (!db || !state || !fetchExams || !statusMeta || !escapeHtml || !qs || !qsa || !ask || !showError || !notify) {\n      throw new Error("Assessment Student Attempt dependencies are incomplete");\n    }\n${body}\n    return Object.freeze({ studentExamList, openStudentAttemptResult, clearLiveTimer });\n  };\n})();\n`;
          fs.mkdirSync('js/assessment',{recursive:true});
          fs.writeFileSync('js/assessment/student-attempt.js',module);

          const bridge=`  /* SECTION 5/7 moved to js/assessment/student-attempt.js */\n  const studentAttemptModule = window.AICLO_ASSESSMENT_MODULES?.createStudentAttemptModule?.({\n    db,\n    state,\n    fetchExams,\n    statusMeta,\n    escapeHtml,\n    qs,\n    qsa,\n    ask,\n    showError,\n    notify,\n    openDrawer: typeof openDrawer === "function" ? openDrawer : null,\n    replaceDrawer: typeof replaceDrawer === "function" ? replaceDrawer : null,\n  });\n  if (!studentAttemptModule) throw new Error("Assessment Student Attempt module was not loaded");\n  const { studentExamList, openStudentAttemptResult, clearLiveTimer } = studentAttemptModule;\n\n`;
          s=s.slice(0,a)+bridge+s.slice(b);
          s=s.replace('const runtime = { root: null, liveTimer: null };','const runtime = { root: null };');
          s=s.replace('const VERSION = "12.3.0-a2";','const VERSION = "12.3.0-a3";');
          fs.writeFileSync(p,s);
          NODE

      - name: Wire Attempt module before Results
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='app.html';
          let s=fs.readFileSync(p,'utf8');
          const old='<script defer src="js/assessment/common.js?v=12.3.0-a1"></script><script defer src="js/assessment/results.js?v=12.3.0-a2"></script><script defer src="js/assessment.js?v=12.3.0-a2"></script>';
          const neu='<script defer src="js/assessment/common.js?v=12.3.0-a1"></script><script defer src="js/assessment/student-attempt.js?v=12.3.0-a3"></script><script defer src="js/assessment/results.js?v=12.3.0-a2"></script><script defer src="js/assessment.js?v=12.3.0-a3"></script>';
          if(!s.includes(old)) throw new Error('Expected A2 script chain not found');
          s=s.replace(old,neu);
          fs.writeFileSync(p,s);
          NODE

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment/common.js
          node --check js/assessment/student-attempt.js
          node --check js/assessment/results.js
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const owner=fs.readFileSync('js/assessment.js','utf8');
          const attempt=fs.readFileSync('js/assessment/student-attempt.js','utf8');
          const app=fs.readFileSync('app.html','utf8');
          const must=(x,m)=>{if(!x)throw new Error(m)};
          must(owner.includes('12.3.0-a3'),'Owner version not A3');
          must(owner.includes('createStudentAttemptModule'),'Owner does not instantiate Attempt module');
          must(!owner.includes('async function startStudentAttempt'),'Attempt implementation still duplicated in owner');
          must(!owner.includes('function showStudentQuestion'),'Student question implementation still duplicated in owner');
          must(!owner.includes('runtime.liveTimer'),'Timer state still leaks into owner');
          must(attempt.includes('let liveTimer = null'),'Attempt does not own timer');
          must(attempt.includes('async function studentExamList'),'studentExamList missing from module');
          must(attempt.includes('async function openStudentAttemptResult'),'result API missing from module');
          must(attempt.includes('async function submitStudentAttempt'),'submit missing from module');
          must(!attempt.includes('window.exams ='),'Attempt must not own window.exams');
          must(!attempt.includes('window.results ='),'Attempt must not own window.results');
          must(!attempt.includes('MutationObserver'),'Attempt must not introduce MutationObserver');
          must((owner.match(/window\.exams\s*=/g)||[]).length===1,'Owner window.exams count invalid');
          must((owner.match(/window\.results\s*=/g)||[]).length===1,'Owner window.results count invalid');
          const iCommon=app.indexOf('js/assessment/common.js');
          const iAttempt=app.indexOf('js/assessment/student-attempt.js');
          const iResults=app.indexOf('js/assessment/results.js');
          const iOwner=app.indexOf('js/assessment.js?v=12.3.0-a3');
          must(iCommon>=0&&iAttempt>iCommon&&iResults>iAttempt&&iOwner>iResults,'Assessment module script order invalid');
          console.log('V12.3 A3 static check PASS');
          NODE

      - name: Commit A3 and remove workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.3-a3-attempt-once.yml
          git add js/assessment.js js/assessment/student-attempt.js app.html
          git commit -m 'refactor(assessment): extract V12.3 student attempt module'
          git push origin HEAD:v12.3-assessment-modular
