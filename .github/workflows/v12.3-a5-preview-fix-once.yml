name: V12.3 A5 Preview Fix Once

on:
  push:
    branches: [v12.3-assessment-modular]
    paths: ['.github/workflows/v12.3-a5-preview-fix-once.yml']

permissions:
  contents: write

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3-assessment-modular
          fetch-depth: 0

      - name: Correct frozen preview collection, CLO scoring and Attempt navigation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment/online-lifecycle.js';
          let s=fs.readFileSync(p,'utf8');

          const start='      async function loadTeacherPreviewQuestions(exam) {';
          const end='      async function openTeacherPreview(exam) {';
          const a=s.indexOf(start), b=s.indexOf(end);
          if(a<0||b<0||b<=a) throw new Error('Preview loader boundaries missing');
          const loader=`      async function loadTeacherPreviewQuestions(exam) {\n        const [{ data: chosen, error: ce }, { data: pool, error: pe }] =\n          await Promise.all([\n            db\n              .from("exam_questions")\n              .select("question_id,question_order")\n              .eq("exam_id", exam.id)\n              .order("question_order"),\n            db\n              .from("exam_question_pool")\n              .select(\n                "question_id,chapter_name,topic_name,clo_code,content,correct_answer,explanation,options",\n              )\n              .eq("exam_id", exam.id),\n          ]);\n        if (ce) throw ce;\n        if (pe) throw pe;\n        const map = new Map((pool || []).map((x) => [x.question_id, x]));\n        let questions = (chosen || [])\n          .map((x) => map.get(x.question_id))\n          .filter(Boolean);\n        if (exam.shuffle_questions) questions = shuffle(questions);\n        if (exam.shuffle_options)\n          questions = questions.map((q) => ({\n            ...q,\n            options: shuffle(q.options || []),\n          }));\n        return questions;\n      }\n`;
          s=s.slice(0,a)+loader+s.slice(b);

          const scoreStart='      function showTeacherPreviewResult(exam, questions, answers) {';
          const scoreEnd='\n\n\n    return Object.freeze({ onlineTable, bindOnlineList, openExamDetail });';
          const c=s.indexOf(scoreStart), d=s.indexOf(scoreEnd);
          if(c<0||d<0||d<=c) throw new Error('Preview result boundaries missing');
          const oldScore=s.slice(c,d);
          const marker='        const html = `';
          const htmlIndex=oldScore.indexOf(marker);
          if(htmlIndex<0) throw new Error('Preview result HTML anchor missing');
          const tail=oldScore.slice(htmlIndex);
          const fixedHead=`      function showTeacherPreviewResult(exam, questions, answers) {\n        const correct = questions.filter(\n            (q) => answers[q.question_id] === q.correct_answer,\n          ).length,\n          codes = [...new Set(questions.map((q) => q.clo_code).filter(Boolean))];\n        const byClo = codes.map((code) => {\n          const cloQuestions = questions.filter((q) => q.clo_code === code);\n          const right = cloQuestions.filter(\n            (q) => answers[q.question_id] === q.correct_answer,\n          ).length;\n          return {\n            code,\n            total: cloQuestions.length,\n            correct: right,\n            score: cloQuestions.length ? (right * 10) / cloQuestions.length : 0,\n          };\n        });\n`;
          s=s.slice(0,c)+fixedHead+tail+s.slice(d);
          fs.writeFileSync(p,s);

          const ap='js/assessment/student-attempt.js';
          let attempt=fs.readFileSync(ap,'utf8');
          const badNext='${index === qs.length - 1 ? "disabled" : ""}';
          const goodNext='${index === questions.length - 1 ? "disabled" : ""}';
          if(!attempt.includes(badNext)) throw new Error('Attempt next-button anchor missing');
          attempt=attempt.replace(badNext,goodNext);
          fs.writeFileSync(ap,attempt);

          let owner=fs.readFileSync('js/assessment.js','utf8');
          owner=owner.replace('const VERSION = "12.3.0-a5";','const VERSION = "12.3.0-a5.1";');
          fs.writeFileSync('js/assessment.js',owner);

          let app=fs.readFileSync('app.html','utf8');
          app=app.replace(/js\/assessment\/online-lifecycle\.js\?v=[^"]+/,'js/assessment/online-lifecycle.js?v=12.3.0-a5.1');
          app=app.replace(/js\/assessment\/student-attempt\.js\?v=[^"]+/,'js/assessment/student-attempt.js?v=12.3.0-a5.1');
          app=app.replace(/js\/assessment\.js\?v=[^"]+/,'js/assessment.js?v=12.3.0-a5.1');
          fs.writeFileSync('app.html',app);
          NODE

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment/common.js
          node --check js/assessment/online-lifecycle.js
          node --check js/assessment/online-builder.js
          node --check js/assessment/student-attempt.js
          node --check js/assessment/results.js
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const life=fs.readFileSync('js/assessment/online-lifecycle.js','utf8');
          const attempt=fs.readFileSync('js/assessment/student-attempt.js','utf8');
          const owner=fs.readFileSync('js/assessment.js','utf8');
          const app=fs.readFileSync('app.html','utf8');
          const must=(x,m)=>{if(!x)throw new Error(m)};
          must(life.includes('let questions = (chosen || [])'),'Preview does not reconstruct selected frozen questions');
          must(life.includes('questions = shuffle(questions)'),'Preview question shuffle missing');
          must(life.includes('const cloQuestions = questions.filter((q) => q.clo_code === code);'),'CLO subset scoring missing');
          must(!/\bqs\.(?:length|map|filter|forEach)\b|\bqs\s*\[/.test(life),'Lifecycle still treats qs DOM helper as collection');
          must(!/\bqs\.(?:length|map|filter|forEach)\b|\bqs\s*\[/.test(attempt),'Attempt still treats qs DOM helper as collection');
          must(attempt.includes('index === questions.length - 1'),'Attempt next-button boundary not fixed');
          must(owner.includes('12.3.0-a5.1'),'Owner version not A5.1');
          must(app.includes('online-lifecycle.js?v=12.3.0-a5.1'),'Lifecycle cache key not updated');
          must(app.includes('student-attempt.js?v=12.3.0-a5.1'),'Attempt cache key not updated');
          must((owner.match(/window\.exams\s*=/g)||[]).length===1,'Owner window.exams invalid');
          must((owner.match(/window\.results\s*=/g)||[]).length===1,'Owner window.results invalid');
          console.log('V12.3 A5.1 preview/runtime guard PASS');
          NODE

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.3-a5-preview-fix-once.yml
          git add js/assessment/online-lifecycle.js js/assessment/student-attempt.js js/assessment.js app.html
          git commit -m 'fix(assessment): correct V12.3 preview and attempt collection references'
          git push origin HEAD:v12.3-assessment-modular
