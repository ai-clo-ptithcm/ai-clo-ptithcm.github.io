name: V12.2.1 Assessment Sections Once

on:
  push:
    branches: [v12.2.1-assessment-refactor]
    paths: ['.github/workflows/v12.2.1-sections-once.yml']

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.2.1-assessment-refactor
          fetch-depth: 0

      - name: Normalize section layout and helper names
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment.js';
          let s=fs.readFileSync(p,'utf8');
          const must=(cond,msg)=>{if(!cond)throw new Error(msg)};
          const count=(re)=>(s.match(re)||[]).length;

          must(s.includes('const VERSION = "12.2.1";')||s.includes("const VERSION = '12.2.1';"),'Unexpected Assessment version');
          must(count(/window\.exams\s*=/g)===1,'Expected one window.exams owner');
          must(count(/window\.results\s*=/g)===1,'Expected one window.results owner');

          const renames=[
            [/\$\$1\b/g,'qsa'],
            [/\$1\b/g,'qs'],
            [/\besc2\b/g,'escapeHtml'],
            [/\bfmt\b/g,'formatDateTime'],
            [/\biso\b/g,'toIsoOrNull'],
            [/\bbyId\b/g,'findById'],
            [/\bshuf\b/g,'shuffle'],
          ];
          for(const [re,to] of renames)s=s.replace(re,to);

          const sections=[
            ['async function schemaReady()', 'SECTION 1/7 — Core runtime, schema, shared data and list rendering'],
            ['async function setStatus(', 'SECTION 2/7 — Online assessment lifecycle, detail and teacher preview'],
            ['function defaultBuilder(', 'SECTION 3/7 — Online assessment builder, matrix, draw, replace and Gemini'],
            ['/* ---------- Final exam V12.2 canonical workflow ---------- */', 'SECTION 4/7 — Final exam builder, secure bank, variants, snapshots and export handoff'],
            ['const attemptLocalKey', 'SECTION 5/7 — Student attempt, resume, timer, autosave, submit and attempt result'],
            ['function scorePolicyLabel(', 'SECTION 6/7 — Official results, GPA/CLO aggregation and explicit AI analysis'],
            ['async function exams(', 'SECTION 7/7 — Public Assessment entry points and single runtime ownership'],
          ];
          for(const [needle,label] of sections){
            must(s.includes(needle),`Missing section anchor: ${needle}`);
            if(needle.startsWith('/* ---------- Final exam')){
              s=s.replace(needle,`\n  /* ============================================================\n   * ${label}\n   * ============================================================ */`);
            }else{
              s=s.replace(needle,`\n  /* ============================================================\n   * ${label}\n   * ============================================================ */\n  ${needle}`);
            }
          }

          s=s.replace(
            'Refactor only: formatted source, explicit runtime/root state, same V12.2 behavior.',
            'Refactor only: formatted source, explicit runtime/root state, sectioned domains and clearer helper names; same V12.2 behavior.'
          );

          fs.writeFileSync(p,s);
          NODE

      - name: Format Assessment source
        run: npx --yes prettier@3.3.3 --write js/assessment.js

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('js/assessment.js','utf8');
          const count=(re)=>(s.match(re)||[]).length;
          const must=(cond,msg)=>{if(!cond)throw new Error(msg)};
          must(count(/SECTION [1-7]\/7/g)===7,'Expected exactly seven Assessment sections');
          must(count(/window\.exams\s*=/g)===1,'window.exams must have one owner');
          must(count(/window\.results\s*=/g)===1,'window.results must have one owner');
          must(!s.includes('MutationObserver'),'Assessment must not introduce MutationObserver');
          must(count(/#content/g)===1,'Assessment root fallback must remain unique');
          must(!s.includes('$$1'),'Legacy $$1 helper still exists');
          must(!s.includes('$1('),'Legacy $1 helper still exists');
          for(const name of ['qsa','qs','escapeHtml','formatDateTime','toIsoOrNull','findById','shuffle'])must(s.includes(name),`Missing normalized helper ${name}`);
          const funcs=count(/\b(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(/g);
          must(funcs===127,`Named function count changed: ${funcs}`);
          const lines=s.split(/\r?\n/).length;
          console.log(`V12.2.1 section check PASS: ${lines} lines, ${funcs} named functions, 7 sections`);
          NODE

      - name: Commit normalization and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.2.1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.2.1-sections-once.yml
          git add js/assessment.js
          git commit -m 'refactor(assessment): section V12.2.1 domains and normalize helpers'
          git push origin HEAD:v12.2.1-assessment-refactor
