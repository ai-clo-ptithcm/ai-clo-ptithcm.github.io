name: V12.3 Assessment Lifecycle Once

on:
  push:
    branches: [v12.3-assessment-modular]
    paths: ['.github/workflows/v12.3-a5-lifecycle-once.yml']

permissions:
  contents: write

jobs:
  split-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3-assessment-modular
          fetch-depth: 0

      - name: Extract Online Lifecycle factory
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment.js';
          let s=fs.readFileSync(p,'utf8');

          const onlineStart='  function onlineTable(items, counts) {';
          const onlineEnd='  function finalStatusLabel(s) {';
          const bindStart='  function bindOnlineList(root, items) {';
          const bindEnd='  function bindFinalList(root, items) {';
          const secStart='  /* ============================================================\n   * SECTION 2/7 — Online assessment lifecycle, detail and teacher preview\n   * ============================================================ */';
          const secEnd='  /* SECTION 3/7 moved to js/assessment/online-builder.js */';

          const a=s.indexOf(onlineStart), b=s.indexOf(onlineEnd);
          const c=s.indexOf(bindStart), d=s.indexOf(bindEnd);
          const e=s.indexOf(secStart), f=s.indexOf(secEnd);
          if([a,b,c,d,e,f].some(x=>x<0) || !(a<b && c<d && e<f)) throw new Error('A5 extraction boundaries not found');

          let onlineBlock=s.slice(a,b);
          let bindBlock=s.slice(c,d);
          let lifecycleBlock=s.slice(e+secStart.length,f);
          const body=(onlineBlock+'\n'+bindBlock+'\n'+lifecycleBlock).replace(/^  /gm,'      ');

          for(const needle of ['function onlineTable','function bindOnlineList','async function setStatus','async function openExamDetail','function showTeacherPreviewResult']) {
            if(!body.includes(needle)) throw new Error('Missing lifecycle member: '+needle);
          }

          const module=`/* AI-CLO PTITHCM V12.3 — Online Assessment Lifecycle module. */\n(() => {\n  "use strict";\n  window.AICLO_ASSESSMENT_MODULES = window.AICLO_ASSESSMENT_MODULES || {};\n  window.AICLO_ASSESSMENT_MODULES.createOnlineLifecycleModule = function createOnlineLifecycleModule(ctx) {\n    const {\n      db, ask, notify, showError, getAssessmentRoot, exams, openExamBuilder, studentResultHtml,\n      statusMeta, modeLabel, structureLabel, escapeHtml, formatDateTime, qs, qsa, shuffle,\n      openDrawer, replaceDrawer\n    } = ctx;\n    if (!db || !ask || !notify || !showError || !getAssessmentRoot || !exams || !openExamBuilder || !studentResultHtml || !statusMeta || !modeLabel || !structureLabel || !escapeHtml || !formatDateTime || !qs || !qsa || !shuffle) {\n      throw new Error("Assessment Online Lifecycle dependencies are incomplete");\n    }\n${body}\n    return Object.freeze({ onlineTable, bindOnlineList, openExamDetail });\n  };\n})();\n`;
          fs.mkdirSync('js/assessment',{recursive:true});
          fs.writeFileSync('js/assessment/online-lifecycle.js',module);

          // Remove non-contiguous online list blocks first, from later index to earlier index.
          s=s.slice(0,c)+s.slice(d);
          // Recompute online block indexes after previous removal.
          const aa=s.indexOf(onlineStart), bb=s.indexOf(onlineEnd);
          if(aa<0||bb<0||bb<=aa) throw new Error('onlineTable re-location failed');
          s=s.slice(0,aa)+s.slice(bb);
          // Remove SECTION 2 after prior edits by markers.
          const ee=s.indexOf(secStart), ff=s.indexOf(secEnd);
          if(ee<0||ff<0||ff<=ee) throw new Error('SECTION 2 re-location failed');
          s=s.slice(0,ee)+s.slice(ff);

          const teacher='  async function teacherExamList(c) {';
          const ti=s.indexOf(teacher);
          if(ti<0) throw new Error('teacherExamList anchor missing');
          const bridge=`  /* SECTION 2/7 moved to js/assessment/online-lifecycle.js */\n  const onlineLifecycleModule = window.AICLO_ASSESSMENT_MODULES?.createOnlineLifecycleModule?.({\n    db,\n    ask,\n    notify,\n    showError,\n    getAssessmentRoot,\n    exams,\n    openExamBuilder: (...args) => openExamBuilder(...args),\n    studentResultHtml: (...args) => studentResultHtml(...args),\n    statusMeta,\n    modeLabel,\n    structureLabel,\n    escapeHtml,\n    formatDateTime,\n    qs,\n    qsa,\n    shuffle,\n    openDrawer: typeof openDrawer === "function" ? openDrawer : null,\n    replaceDrawer: typeof replaceDrawer === "function" ? replaceDrawer : null,\n  });\n  if (!onlineLifecycleModule) throw new Error("Assessment Online Lifecycle module was not loaded");\n  const { onlineTable, bindOnlineList, openExamDetail } = onlineLifecycleModule;\n\n`;
          s=s.slice(0,ti)+bridge+s.slice(ti);
          s=s.replace('const VERSION = "12.3.0-a4.1";','const VERSION = "12.3.0-a5";');
          fs.writeFileSync(p,s);
          NODE

      - name: Export internal student result renderer
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment/student-attempt.js';
          let s=fs.readFileSync(p,'utf8');
          const old='return Object.freeze({ studentExamList, openStudentAttemptResult, clearLiveTimer });';
          const neu='return Object.freeze({ studentExamList, openStudentAttemptResult, clearLiveTimer, studentResultHtml });';
          if(!s.includes(old)) throw new Error('Student Attempt export anchor missing');
          s=s.replace(old,neu);
          fs.writeFileSync(p,s);

          const op='js/assessment.js';
          let o=fs.readFileSync(op,'utf8');
          const oldBridge='const { studentExamList, openStudentAttemptResult, clearLiveTimer } = studentAttemptModule;';
          const newBridge='const { studentExamList, openStudentAttemptResult, clearLiveTimer, studentResultHtml } = studentAttemptModule;';
          if(!o.includes(oldBridge)) throw new Error('Owner Attempt destructure anchor missing');
          o=o.replace(oldBridge,newBridge);
          fs.writeFileSync(op,o);
          NODE

      - name: Wire Lifecycle module
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='app.html';
          let s=fs.readFileSync(p,'utf8');
          if(s.includes('js/assessment/online-lifecycle.js')) throw new Error('Lifecycle script already present');
          const anchor=/\<script defer src="js\/assessment\/online-builder\.js\?v=[^"]+"\>\<\/script\>/;
          const m=s.match(anchor);
          if(!m) throw new Error('Online Builder script anchor missing');
          s=s.replace(m[0],`<script defer src="js/assessment/online-lifecycle.js?v=12.3.0-a5"></script>${m[0]}`);
          s=s.replace(/js\/assessment\/student-attempt\.js\?v=[^"]+/,'js/assessment/student-attempt.js?v=12.3.0-a5');
          s=s.replace(/js\/assessment\.js\?v=[^"]+/,'js/assessment.js?v=12.3.0-a5');
          fs.writeFileSync(p,s);
          NODE

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment/common.js
          node --check js/assessment/online-lifecycle.js
          node --check js/assessment/online-builder.js
          node --check js/assessment/student-attempt.js
          node --check js/assessment/results.js
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const owner=fs.readFileSync('js/assessment.js','utf8');
          const life=fs.readFileSync('js/assessment/online-lifecycle.js','utf8');
          const attempt=fs.readFileSync('js/assessment/student-attempt.js','utf8');
          const app=fs.readFileSync('app.html','utf8');
          const must=(x,m)=>{if(!x)throw new Error(m)};
          must(owner.includes('12.3.0-a5'),'Owner version not A5');
          must(owner.includes('createOnlineLifecycleModule'),'Owner does not instantiate lifecycle');
          must(!owner.includes('async function setStatus('),'setStatus still duplicated in owner');
          must(!owner.includes('async function openExamDetail('),'openExamDetail still duplicated in owner');
          must(!owner.includes('function onlineTable('),'onlineTable still duplicated in owner');
          must(!owner.includes('function bindOnlineList('),'bindOnlineList still duplicated in owner');
          must(life.includes('async function setStatus('),'Lifecycle setStatus missing');
          must(life.includes('async function openExamDetail('),'Lifecycle openExamDetail missing');
          must(life.includes('function onlineTable('),'Lifecycle onlineTable missing');
          must(life.includes('function bindOnlineList('),'Lifecycle bindOnlineList missing');
          must(life.includes('studentResultHtml(data)'),'Teacher submitted-attempt renderer not wired');
          must(attempt.includes('studentResultHtml });'),'Student renderer not exported internally');
          must(!life.includes('window.exams ='),'Lifecycle must not own window.exams');
          must(!life.includes('window.results ='),'Lifecycle must not own window.results');
          must(!life.includes('MutationObserver'),'Lifecycle must not add observer');
          must((owner.match(/window\.exams\s*=/g)||[]).length===1,'Owner window.exams count invalid');
          must((owner.match(/window\.results\s*=/g)||[]).length===1,'Owner window.results count invalid');
          const iCommon=app.indexOf('js/assessment/common.js');
          const iLife=app.indexOf('js/assessment/online-lifecycle.js');
          const iBuilder=app.indexOf('js/assessment/online-builder.js');
          const iAttempt=app.indexOf('js/assessment/student-attempt.js');
          const iResults=app.indexOf('js/assessment/results.js');
          const iOwner=app.indexOf('js/assessment.js?v=12.3.0-a5');
          must(iCommon>=0 && iLife>iCommon && iBuilder>iLife && iAttempt>iBuilder && iResults>iAttempt && iOwner>iResults,'Assessment script order invalid');
          console.log('V12.3 A5 static check PASS');
          NODE

      - name: Commit A5 and remove workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.3-a5-lifecycle-once.yml
          git add js/assessment.js js/assessment/online-lifecycle.js js/assessment/student-attempt.js app.html
          git commit -m 'refactor(assessment): extract V12.3 online lifecycle module'
          git push origin HEAD:v12.3-assessment-modular
