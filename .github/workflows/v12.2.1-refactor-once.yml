name: V12.2.1 Assessment Refactor Once

on:
  push:
    branches: [v12.2.1-assessment-refactor]
    paths: ['.github/workflows/v12.2.1-refactor-once.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.2.1-assessment-refactor
          fetch-depth: 0

      - name: Refactor root and runtime state
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment.js';
          let s=fs.readFileSync(p,'utf8');
          const must=(cond,msg)=>{if(!cond)throw new Error(msg)};
          must(s.includes("const VERSION='12.2.0-step9';"),'Unexpected Assessment version');
          must((s.match(/window\.exams\s*=/g)||[]).length===1,'Expected one window.exams owner before refactor');
          must((s.match(/window\.results\s*=/g)||[]).length===1,'Expected one window.results owner before refactor');

          s=s.replace(
            '/* AI-CLO PTITHCM V12.2 — Assessment single-owner engine.\n   Step 8B: online assessment + official CLO results + canonical final-exam workflow + exports. */',
            '/* AI-CLO PTITHCM V12.2.1 — Assessment single-owner engine.\n   Refactor only: formatted source, explicit runtime/root state, same V12.2 behavior. */'
          );
          s=s.replace("const VERSION='12.2.0-step9';","const VERSION='12.2.1';");
          s=s.replace("'use strict';","'use strict';\n\n/* App-shell dependencies: db, state, canTeach, toast, err, modal, closeModal,\n   openDrawer, replaceDrawer and confirmAction. Assessment remains the only runtime owner. */");

          // Replace every legacy route-root lookup before inserting the single fallback.
          s=s.replace(/\$1\((['"])#content\1\)/g,'getAssessmentRoot()');

          // Consolidate route/timer state without changing behavior.
          s=s.replace(/\bliveTimer\b/g,'runtime.liveTimer');
          s=s.replace(
            'let runtime.liveTimer=null;',
            "const runtime={root:null,liveTimer:null};\nconst getAssessmentRoot=()=>runtime.root||document.querySelector('#content');\nconst setAssessmentRoot=root=>{if(root)runtime.root=root;return getAssessmentRoot()};"
          );

          // Capture the actual route root whenever the app enters Assessment/Results.
          s=s.replace('async function exams(c){','async function exams(c){c=setAssessmentRoot(c);');
          s=s.replace('async function results(c){try{','async function results(c){c=setAssessmentRoot(c);try{');

          fs.writeFileSync(p,s);
          NODE

      - name: Format Assessment source
        run: npx --yes prettier@3.3.3 --write js/assessment.js

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('js/assessment.js','utf8');
          const count=(re)=>(s.match(re)||[]).length;
          const must=(cond,msg)=>{if(!cond)throw new Error(msg)};
          must(s.includes('12.2.1'),'Version was not upgraded');
          must(count(/window\.exams\s*=/g)===1,'window.exams must have exactly one owner');
          must(count(/window\.results\s*=/g)===1,'window.results must have exactly one owner');
          must(!s.includes('MutationObserver'),'Assessment must not introduce MutationObserver');
          must(count(/#content/g)===1,'Hardcoded #content must remain only as root fallback');
          must(s.includes('getAssessmentRoot'),'Missing canonical root helper');
          must(s.includes('setAssessmentRoot'),'Missing root capture helper');
          must(s.includes('runtime.liveTimer'),'Timer state was not normalized');
          must(!/\$1\((['"])#content\1\)/.test(s),'Legacy $1(#content) lookup still exists');
          const lines=s.split(/\r?\n/).length;
          const funcs=count(/\b(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(/g);
          console.log(`V12.2.1 static check PASS: ${lines} lines, ${funcs} named functions`);
          NODE

      - name: Commit refactor and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.2.1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.2.1-refactor-once.yml
          git add js/assessment.js
          git commit -m 'refactor(assessment): normalize V12.2.1 source and route state'
          git push origin HEAD:v12.2.1-assessment-refactor
