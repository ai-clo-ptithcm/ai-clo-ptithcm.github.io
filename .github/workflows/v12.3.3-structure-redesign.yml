name: V12.3.3 Structure Redesign
on:
  push:
    branches: [v12.3.3-structure-redesign]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3.3-structure-redesign
      - name: Apply structure redesign
        run: python3 scripts/v12.3.3-structure-redesign.py
      - name: Static checks
        run: |
          node --check js/assessment/online-builder.js
          grep -q 'ub-structure-segmented' js/assessment/online-builder.js
          grep -q 'data-v123-chapter-toggle' js/assessment/online-builder.js
          grep -q '12.3.3' app.html
      - name: Commit result
        run: |
          git config user.name 'AI-CLO V12.3.3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/assessment/online-builder.js css/exams/unified-builder.css app.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(assessment): redesign builder structure and matrix UI'
          git push origin HEAD:v12.3.3-structure-redesign
