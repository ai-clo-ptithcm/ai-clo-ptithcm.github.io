name: V12.3 A6 Final Extract Once

on:
  push:
    branches: [v12.3-assessment-modular]
    paths: ['.github/workflows/v12.3-a6-final-extract-once.yml']

permissions:
  contents: write

jobs:
  extract-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3-assessment-modular
          fetch-depth: 0

      - name: Extract Final Exam module
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ownerPath='js/assessment.js';
          let s=fs.readFileSync(ownerPath,'utf8');

          const tableStart='  function finalStatusLabel(s) {';
          const tableEnd='  /* SECTION 2/7 moved to js/assessment/online-lifecycle.js */';
          const ta=s.indexOf(tableStart), tb=s.indexOf(tableEnd);
          if(ta<0||tb<0||tb<=ta) throw new Error('Final table boundaries missing');
          const tableChunk=s.slice(ta,tb).trimEnd();
          s=s.slice(0,ta)+s.slice(tb);

          const bindStart='  function bindFinalList(root, items) {';
          const bindEnd='\n\n  /* SECTION 3/7 moved to js/assessment/online-builder.js */';
          const ba=s.indexOf(bindStart), bb=s.indexOf(bindEnd);
          if(ba<0||bb<0||bb<=ba) throw new Error('Final list binder boundaries missing');
          const bindChunk=s.slice(ba,bb).trimEnd();
          s=s.slice(0,ba)+s.slice(bb);

          const secStart='  /* ============================================================\n   * SECTION 4/7 — Final exam builder, secure bank, variants, snapshots and export handoff\n   * ============================================================ */';
          const secEnd='  /* SECTION 5/7 moved to js/assessment/student-attempt.js */';
          const sa=s.indexOf(secStart), sb=s.indexOf(secEnd);
          if(sa<0||sb<0||sb<=sa) throw new Error('Final SECTION 4 boundaries missing');
          const secChunk=s.slice(sa+secStart.length,sb).trim();
          s=s.slice(0,sa)+s.slice(sb);

          const helpers=`  function optionMap(q) {\n    const out = {};\n    for (const o of q?.question_options || q?.options || []) {\n      const key = String(o?.option_key || o?.key || "").toUpperCase();\n      if (key) out[key] = o?.content || "";\n    }\n    return out;\n  }\n\n  function cloCountsFromQuestions(questions, sets) {\n    const out = {};\n    for (const q of questions || []) {\n      const code = findById(sets?.clos || [], q.clo_id)?.code || q.clo_code || "—";\n      out[code] = (out[code] || 0) + 1;\n    }\n    return out;\n  }`;

          const indent=(text,n=4)=>text.split('\n').map(line=>' '.repeat(n)+line).join('\n');
          const module=`/* AI-CLO PTITHCM V12.3 — Final Exam module. */\n(() => {\n  "use strict";\n  window.AICLO_ASSESSMENT_MODULES = window.AICLO_ASSESSMENT_MODULES || {};\n  window.AICLO_ASSESSMENT_MODULES.createFinalExamModule = function createFinalExamModule(ctx) {\n    const {\n      db, state, subjectId, loadSecureSets, poolSnapshot, getAssessmentRoot, exams, ask,\n      notify, showError, escapeHtml, formatDateTime, findById, shuffle, qs, qsa, modal\n    } = ctx;\n    if (!db || !state || !subjectId || !loadSecureSets || !poolSnapshot || !getAssessmentRoot || !exams || !ask || !notify || !showError || !escapeHtml || !formatDateTime || !findById || !shuffle || !qs || !qsa) {\n      throw new Error("Assessment Final Exam dependencies are incomplete");\n    }\n\n${indent(tableChunk)}\n\n${indent(bindChunk)}\n\n${indent(helpers,4)}\n\n${indent(secChunk)}\n\n    return Object.freeze({ finalTable, bindFinalList, openFinalExamBuilder, openFinalExamDetail });\n  };\n})();\n`;
          fs.mkdirSync('js/assessment',{recursive:true});
          fs.writeFileSync('js/assessment/final-exam.js',module);

          const studentMarker='  /* SECTION 5/7 moved to js/assessment/student-attempt.js */';
          const wire=`  /* SECTION 4/7 moved to js/assessment/final-exam.js */\n  const finalExamModule = window.AICLO_ASSESSMENT_MODULES?.createFinalExamModule?.({\n    db, state, subjectId, loadSecureSets, poolSnapshot, getAssessmentRoot, exams, ask,\n    notify, showError, escapeHtml, formatDateTime, findById, shuffle, qs, qsa,\n    modal: typeof modal === "function" ? modal : null,\n  });\n  if (!finalExamModule) throw new Error("Assessment Final Exam module was not loaded");\n  const { finalTable, bindFinalList, openFinalExamBuilder, openFinalExamDetail } = finalExamModule;\n\n`;
          const wi=s.indexOf(studentMarker);
          if(wi<0) throw new Error('Student module marker missing for Final wiring');
          s=s.slice(0,wi)+wire+s.slice(wi);
          s=s.replace('const VERSION = "12.3.0-a5.1";','const VERSION = "12.3.0-a6";');
          fs.writeFileSync(ownerPath,s);

          let app=fs.readFileSync('app.html','utf8');
          const ownerScript=app.match(/<script[^>]+src="js\/assessment\.js\?v=[^"]+"[^>]*><\/script>/)?.[0];
          if(!ownerScript) throw new Error('Assessment owner script missing');
          if(!app.includes('js/assessment/final-exam.js')) {
            app=app.replace(ownerScript,`<script defer src="js/assessment/final-exam.js?v=12.3.0-a6"></script>${ownerScript}`);
          }
          app=app.replace(/js\/assessment\.js\?v=[^"]+/,'js/assessment.js?v=12.3.0-a6');
          fs.writeFileSync('app.html',app);
          NODE

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment/common.js
          node --check js/assessment/online-lifecycle.js
          node --check js/assessment/online-builder.js
          node --check js/assessment/final-exam.js
          node --check js/assessment/student-attempt.js
          node --check js/assessment/results.js
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const paths=['common.js','online-lifecycle.js','online-builder.js','final-exam.js','student-attempt.js','results.js'];
          const owner=fs.readFileSync('js/assessment.js','utf8');
          const final=fs.readFileSync('js/assessment/final-exam.js','utf8');
          const app=fs.readFileSync('app.html','utf8');
          const must=(x,m)=>{if(!x)throw new Error(m)};
          must(final.includes('createFinalExamModule'),'Final factory missing');
          must(final.includes('function optionMap(q)'),'Final optionMap helper missing');
          must(final.includes('function cloCountsFromQuestions('),'Final CLO counter helper missing');
          must(final.includes('save_final_exam_package'),'Final atomic save RPC missing');
          must(final.includes('validateStoredFinalPackage'),'Final export validation missing');
          must(final.includes('AICLO_FINAL_EXPORTS'),'Final exporter handoff missing');
          must(final.includes('return Object.freeze({ finalTable, bindFinalList, openFinalExamBuilder, openFinalExamDetail })'),'Final public API invalid');
          must(!final.includes('window.exams =') && !final.includes('window.results ='),'Final module owns public route');
          must(!owner.includes('function defaultFinalCtx('),'Final implementation remains in owner');
          must(!owner.includes('function openFinalExamDetail('),'Final detail remains in owner');
          must(owner.includes('12.3.0-a6'),'Owner version not A6');
          must((owner.match(/window\.exams\s*=/g)||[]).length===1,'window.exams ownership invalid');
          must((owner.match(/window\.results\s*=/g)||[]).length===1,'window.results ownership invalid');
          must(!owner.includes('MutationObserver'),'Owner has MutationObserver');
          for(const p of paths) must(app.includes(`js/assessment/${p}`),`app missing ${p}`);
          const order=paths.map(p=>app.indexOf(`js/assessment/${p}`));
          const ownerPos=app.indexOf('js/assessment.js?v=12.3.0-a6');
          must(order.every(x=>x>=0 && x<ownerPos),'A module loads after owner');
          must((app.match(/js\/assessment\/final-exam\.js/g)||[]).length===1,'Final script duplicated');
          console.log('V12.3 A6 Final extraction PASS');
          NODE

      - name: Commit extraction and remove workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.3-a6-final-extract-once.yml
          git add app.html js/assessment.js js/assessment/final-exam.js
          git commit -m 'refactor(assessment): extract V12.3 final exam module'
          git push origin HEAD:v12.3-assessment-modular
