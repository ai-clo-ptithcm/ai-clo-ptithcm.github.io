name: Temporary production JS check

on:
  push:
    paths:
      - '.github/workflows/temporary-production-js-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check assessment owners
        run: |
          node --check js/assessment/online-builder.js
          node --check js/assessment/online-lifecycle.js
          node --check js/assessment/student-attempt.js
          grep -q 'online-builder.js?v=12.6.30' app.html
          grep -q 'online-lifecycle.js?v=12.6.30' app.html
          grep -q 'student-attempt.js?v=12.6.30' app.html
