name: V12.3 Assessment Builder Once

on:
  push:
    branches: [v12.3-assessment-modular]
    paths: ['.github/workflows/v12.3-a4-builder-once.yml']

permissions:
  contents: write

jobs:
  split-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3-assessment-modular
          fetch-depth: 0

      - name: Extract Online Builder factory
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/assessment.js';
          let s=fs.readFileSync(p,'utf8');
          const start='  /* ============================================================\n   * SECTION 3/7 — Online assessment builder, matrix, draw, replace and Gemini\n   * ============================================================ */';
          const end='  /* ============================================================\n   * SECTION 4/7 — Final exam builder, secure bank, variants, snapshots and export handoff\n   * ============================================================ */';
          const a=s.indexOf(start), b=s.indexOf(end);
          if(a<0||b<0||b<=a) throw new Error('Could not locate SECTION 3 boundaries');
          let body=s.slice(a+start.length,b);
          for(const name of ['defaultBuilder','openExamBuilder','renderBuilder','generateAiQuestion','saveBuilder']) {
            if(!body.includes(name)) throw new Error(name+' missing from SECTION 3');
          }
          body=body.replace(/^  /gm,'      ');
          const module=`/* AI-CLO PTITHCM V12.3 — Online Assessment Builder module. */\n(() => {\n  "use strict";\n  window.AICLO_ASSESSMENT_MODULES = window.AICLO_ASSESSMENT_MODULES || {};\n  window.AICLO_ASSESSMENT_MODULES.createOnlineBuilderModule = function createOnlineBuilderModule(ctx) {\n    const {\n      db, state, subjectId, loadPracticeSets, poolSnapshot, snapshotQuestion, validOptions,\n      getAssessmentRoot, exams, openExamDetail, escapeHtml, localInput, toIsoOrNull,\n      findById, shuffle, notify, showError, qs, qsa, ask, openDrawer, replaceDrawer, modal, closeModal\n    } = ctx;\n    if (!db || !state || !subjectId || !loadPracticeSets || !poolSnapshot || !snapshotQuestion || !getAssessmentRoot || !exams || !openExamDetail || !escapeHtml || !localInput || !toIsoOrNull || !findById || !shuffle || !notify || !showError || !qs || !qsa || !ask) {\n      throw new Error("Assessment Online Builder dependencies are incomplete");\n    }\n${body}\n    return Object.freeze({ openExamBuilder });\n  };\n})();\n`;
          fs.mkdirSync('js/assessment',{recursive:true});
          fs.writeFileSync('js/assessment/online-builder.js',module);
          const bridge=`  /* SECTION 3/7 moved to js/assessment/online-builder.js */\n  const onlineBuilderModule = window.AICLO_ASSESSMENT_MODULES?.createOnlineBuilderModule?.({\n    db, state, subjectId, loadPracticeSets, poolSnapshot, snapshotQuestion, validOptions,\n    getAssessmentRoot, exams, openExamDetail, escapeHtml, localInput, toIsoOrNull,\n    findById, shuffle, notify, showError, qs, qsa, ask,\n    openDrawer: typeof openDrawer === "function" ? openDrawer : null,\n    replaceDrawer: typeof replaceDrawer === "function" ? replaceDrawer : null,\n    modal: typeof modal === "function" ? modal : null,\n    closeModal: typeof closeModal === "function" ? closeModal : null,\n  });\n  if (!onlineBuilderModule) throw new Error("Assessment Online Builder module was not loaded");\n  const { openExamBuilder } = onlineBuilderModule;\n\n`;
          s=s.slice(0,a)+bridge+s.slice(b);
          s=s.replace('const VERSION = "12.3.0-a3";','const VERSION = "12.3.0-a4";');
          fs.writeFileSync(p,s);
          NODE

      - name: Wire Builder module before Attempt
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='app.html';
          let s=fs.readFileSync(p,'utf8');
          if(s.includes('js/assessment/online-builder.js')) throw new Error('Builder script already present');
          const marker='<script defer src="js/assessment/student-attempt.js?v=12.3.0-a3"></script>';
          if(!s.includes(marker)) throw new Error('Attempt marker not found');
          s=s.replace(marker,'<script defer src="js/assessment/online-builder.js?v=12.3.0-a4"></script>'+marker);
          s=s.replace(/js\/assessment\.js\?v=12\.3\.0-a3/g,'js/assessment.js?v=12.3.0-a4');
          fs.writeFileSync(p,s);
          NODE

      - name: Static verification
        shell: bash
        run: |
          node --check js/assessment/common.js
          node --check js/assessment/online-builder.js
          node --check js/assessment/student-attempt.js
          node --check js/assessment/results.js
          node --check js/assessment.js
          node <<'NODE'
          const fs=require('fs');
          const owner=fs.readFileSync('js/assessment.js','utf8');
          const builder=fs.readFileSync('js/assessment/online-builder.js','utf8');
          const app=fs.readFileSync('app.html','utf8');
          const must=(x,m)=>{if(!x)throw new Error(m)};
          must(owner.includes('12.3.0-a4'),'Owner version not A4');
          must(owner.includes('createOnlineBuilderModule'),'Owner does not instantiate Builder module');
          for(const sig of ['function defaultBuilder','function renderBuilder','async function saveBuilder','async function generateAiQuestion']) must(!owner.includes(sig),'Builder implementation still duplicated: '+sig);
          must(builder.includes('function defaultBuilder'),'defaultBuilder missing');
          must(builder.includes('async function openExamBuilder'),'openExamBuilder missing');
          must(builder.includes('replace_exam_design'),'Atomic replace RPC missing');
          must(builder.includes('generateAiQuestion'),'Gemini builder flow missing');
          must(!builder.includes('window.exams ='),'Builder must not own window.exams');
          must(!builder.includes('window.results ='),'Builder must not own window.results');
          must(!builder.includes('MutationObserver'),'Builder must not introduce MutationObserver');
          must((owner.match(/window\.exams\s*=/g)||[]).length===1,'Owner window.exams count invalid');
          must((owner.match(/window\.results\s*=/g)||[]).length===1,'Owner window.results count invalid');
          const order=['js/assessment/common.js','js/assessment/online-builder.js','js/assessment/student-attempt.js','js/assessment/results.js','js/assessment.js?v=12.3.0-a4'].map(x=>app.indexOf(x));
          must(order.every((x,i)=>x>=0&&(i===0||x>order[i-1])),'Assessment script order invalid');
          console.log('V12.3 A4 static check PASS');
          NODE

      - name: Commit A4 and remove workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.3-a4-builder-once.yml
          git add js/assessment.js js/assessment/online-builder.js app.html
          git commit -m 'refactor(assessment): extract V12.3 online builder module'
          git push origin HEAD:v12.3-assessment-modular
