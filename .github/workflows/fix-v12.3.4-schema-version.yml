name: Fix V12.3.4 Schema Version
on:
  push:
    branches: [v12.3.4-results-excel]
    paths: [.github/workflows/fix-v12.3.4-schema-version.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3.4-results-excel
      - run: python3 scripts/fix-v12.3.4-schema-version.py
      - run: node --check js/assessment.js && grep -q 'const VERSION = "12.3.1"' js/assessment.js
      - run: |
          git config user.name 'AI-CLO V12.3.4 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/assessment.js
          git commit -m 'fix(assessment): keep backend schema version at 12.3.1'
          git push origin HEAD:v12.3.4-results-excel
