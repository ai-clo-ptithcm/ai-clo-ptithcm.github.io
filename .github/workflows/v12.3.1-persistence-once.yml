name: V12.3.1 Persistence Once

on:
  push:
    branches: [v12.3.1-persistence-fix]
    paths: ['.github/workflows/v12.3.1-persistence-once.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3.1-persistence-fix
          fetch-depth: 0

      - name: Patch shared subpage persistence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='js/ui/subpage-state.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("const VERSION='11.8.3';","const VERSION='11.8.4';");
          const old="function liveChildWorkspace(){return !!document.querySelector('.ub-workspace,.assessment-detail-page,.academic-profile-page,.question-workspace')}";
          const next="function liveChildWorkspace(){return !!document.querySelector('.ub-workspace,.assessment-detail-page,.assessment-detail-v122,.assessment-final-builder-v122,.assessment-final-detail-v122,.academic-profile-page,.question-workspace,#sideDrawer:not(.hidden)')}";
          if(!s.includes(old) && !s.includes(next)) throw new Error('liveChildWorkspace anchor missing');
          if(s.includes(old)) s=s.replace(old,next);
          fs.writeFileSync(p,s);

          let app=fs.readFileSync('app.html','utf8');
          app=app.replace(/js\/ui\/subpage-state\.js\?v=[^\"]+/g,'js/ui/subpage-state.js?v=11.8.4');
          fs.writeFileSync('app.html',app);
          NODE

      - name: Static verification
        shell: bash
        run: |
          node --check js/ui/subpage-state.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('js/ui/subpage-state.js','utf8');
          const app=fs.readFileSync('app.html','utf8');
          const must=(x,m)=>{if(!x) throw new Error(m)};
          must(s.includes("const VERSION='11.8.4'"),'version missing');
          must(s.includes('.assessment-detail-v122'),'V12.3 detail selector missing');
          must(s.includes('.assessment-final-builder-v122'),'V12.3 final builder selector missing');
          must(s.includes('.assessment-final-detail-v122'),'V12.3 final detail selector missing');
          must(s.includes('#sideDrawer:not(.hidden)'),'active drawer guard missing');
          must(app.includes('js/ui/subpage-state.js?v=11.8.4'),'cache bump missing');
          must(s.includes("document.addEventListener('visibilitychange'"),'visibility handling missing');
          console.log('V12.3.1 shared persistence PASS');
          NODE

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'AI-CLO V12.3.1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v12.3.1-persistence-once.yml
          git add js/ui/subpage-state.js app.html
          git commit -m 'fix(ui): preserve active Assessment workspace across Chrome tab switches'
          git push origin HEAD:v12.3.1-persistence-fix
