name: V12.3.5 Export Center
on:
  push:
    branches: [v12.3.5-export-center-work]
    paths: [.github/workflows/v12.3.5-export-center.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3.5-export-center-work
      - name: Static checks
        run: |
          node --check js/assessment/online-lifecycle.js
          node --check js/exams/online-export.js
          node --check js/core/office-libs.js
          grep -q 'v1235ExportCenter' js/assessment/online-lifecycle.js
          grep -q 'openExportCenter' js/assessment/online-lifecycle.js
          grep -q 'online-export.js?v=12.3.5' app.html
          grep -q 'online-export.css?v=12.3.5' app.html
          grep -q 'online-lifecycle.js?v=12.3.5' app.html
          grep -q '=== "12.3.1"' js/assessment.js
          test -f js/exams/online-export.js
          test -f css/exams/online-export.css
