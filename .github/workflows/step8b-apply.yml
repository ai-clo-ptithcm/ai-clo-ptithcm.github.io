name: Apply verified Assessment Step 8B

on:
  push:
    branches: [v12.2-assessment-stability]
    paths: [.github/workflows/step8b-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.2-assessment-stability
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('js/assessment.js')
          s=p.read_text(encoding='utf-8')
          old_header='   Step 8A: online assessment + official CLO results + canonical final-exam workflow. */'
          new_header='   Step 8B: online assessment + official CLO results + canonical final-exam workflow + exports. */'
          old_version="const VERSION='12.2.0-step8a';"
          new_version="const VERSION='12.2.0-step8b';"
          anchor='async function openFinalExamDetail(pkgOrId){'
          old_click="$1('#v122FinalExport').onclick=()=>notify('Bước 8B sẽ nối BM06/BM07/BM08/TeX vào nút này.')"
          new_click="$1('#v122FinalExport').onclick=()=>openFinalExportMenu(pkg)"
          for token in (old_header,old_version,anchor,old_click):
              if token not in s:
                  raise SystemExit(f'Patch anchor missing: {token[:80]}')
          block=base64.b64decode('').decode('utf-8')
          s=s.replace(old_header,new_header,1).replace(old_version,new_version,1)
          s=s.replace(anchor,block+anchor,1).replace(old_click,new_click,1)
          p.write_text(s,encoding='utf-8')
          app=Path('app.html')
          a=app.read_text(encoding='utf-8')
          if 'js/assessment.js?v=12.2.1' not in a:
              raise SystemExit('Assessment cache-key anchor missing')
          app.write_text(a.replace('js/assessment.js?v=12.2.1','js/assessment.js?v=12.2.2',1),encoding='utf-8')
          PY
      - name: Verify branch-native engine
        shell: bash
        run: |
          node --check js/assessment.js
          echo "assessment blob: $(git hash-object js/assessment.js)"
          test "$(grep -c 'MutationObserver' js/assessment.js || true)" = "0"
          test "$(grep -c 'window.exams=exams' js/assessment.js)" = "1"
          test "$(grep -c 'window.results=results' js/assessment.js)" = "1"
          grep -q "12.2.0-step8b" js/assessment.js
          grep -q "ensureFinalExports" js/assessment.js
          grep -q "validateStoredFinalPackage" js/assessment.js
          grep -q "openFinalExportMenu" js/assessment.js
          grep -q "api.bm06" js/assessment.js
          grep -q "api.bm07" js/assessment.js
          grep -q "api.bm08" js/assessment.js
          grep -q "api.tex" js/assessment.js
          grep -q "api.answers" js/assessment.js
          grep -q "api.zip" js/assessment.js
          ! grep -q "Bước 8B sẽ nối" js/assessment.js
          grep -q "js/assessment.js?v=12.2.2" app.html
      - name: Commit verified engine and clean transfer files
        shell: bash
        run: |
          rm -f tmp-step8b-marker.txt .github/workflows/step8b-apply.yml
          git config user.name 'AI-CLO V12.2 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/assessment.js app.html tmp-step8b-marker.txt .github/workflows/step8b-apply.yml
          git commit -m 'feat(assessment): complete V12.2 step 8B final exports'
          git push origin HEAD:v12.2-assessment-stability
