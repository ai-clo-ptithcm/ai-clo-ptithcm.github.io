name: V12.3.1 Review AI Once
on:
  workflow_dispatch:
  push:
    branches:
      - v12.3.1-result-ai-review
    paths:
      - .github/workflows/v12.3.1-review-ai-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3.1-result-ai-review
      - name: Apply patch
        run: python3 .github/scripts/v1231_review_ai_patch.py
      - name: Static checks
        run: |
          node --check js/assessment.js
          node --check js/assessment/online-builder.js
          node --check js/assessment/student-attempt.js
      - name: Commit result
        run: |
          rm .github/workflows/v12.3.1-review-ai-once.yml
          rm .github/scripts/v1231_review_ai_patch.py
          git config user.name 'AI-CLO V12.3.1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(assessment): split review permissions and enable attempt AI feedback'
          git push origin HEAD:v12.3.1-result-ai-review
