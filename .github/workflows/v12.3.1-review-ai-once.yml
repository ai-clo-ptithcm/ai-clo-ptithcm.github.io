name: V12.3.1 Review AI Once
on:
  push:
    branches: [v12.3.1-result-ai-review]
    paths: [.github/workflows/v12.3.1-review-ai-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v12.3.1-result-ai-review
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch review permissions and attempt AI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) New backend migration: secure two-level review + current pause contract + schema version.
          mig = r'''-- AI-CLO PTITHCM V12.3.1 — post-submit review permissions + attempt AI contract.
-- Run after V12.2. Idempotent and safe to run again.

begin;

alter table public.exams
  add column if not exists show_review boolean not null default false;

-- Preserve legacy meaning: an exam that already exposed answers must still allow review.
update public.exams
set show_review=true
where coalesce(show_answers,false)=true and coalesce(show_review,false)=false;

comment on column public.exams.show_review is
  'Student may review submitted questions, selected options and right/wrong state. Does not reveal the correct answer.';
comment on column public.exams.show_answers is
  'Student may additionally see correct answers and explanations after submission. Implies review in V12.3.1 UI/RPC.';

-- Keep the canonical V12.3 lifecycle fix in this migration too, so one latest SQL run is sufficient.
alter table public.exams drop constraint if exists exams_status_check;
alter table public.exams add constraint exams_status_check
  check (status in ('draft','active','closed','published','paused','archived'));

create or replace function public.get_attempt_result(p_attempt_id uuid)
returns jsonb
language plpgsql
security definer
set search_path=public,pg_temp
as $$
declare
  v_attempt public.exam_attempts%rowtype;
  v_exam public.exams%rowtype;
  v_clos jsonb;
  v_chapters jsonb;
  v_review jsonb;
  v_total integer;
  v_correct integer;
  v_staff boolean;
  v_can_review boolean;
  v_can_answers boolean;
begin
  select * into v_attempt from public.exam_attempts where id=p_attempt_id;
  if not found then raise exception 'Không tìm thấy lượt làm bài'; end if;
  select * into v_exam from public.exams where id=v_attempt.exam_id;
  if auth.uid()<>v_attempt.student_id and not public.is_admin() and not public.is_subject_teacher(v_exam.subject_id) then
    raise exception 'Không có quyền xem kết quả';
  end if;
  if v_attempt.submitted_at is null then raise exception 'Bài chưa được nộp'; end if;
  perform public.populate_attempt_questions(p_attempt_id);

  select count(*),count(*) filter(where sa.is_correct) into v_total,v_correct
  from public.attempt_questions aq
  left join public.student_answers sa on sa.attempt_id=p_attempt_id and sa.question_id=aq.question_id
  where aq.attempt_id=p_attempt_id;

  select coalesce(jsonb_agg(jsonb_build_object(
    'code',code,'correct',correct_count,'total',total_count,
    'score',round(correct_count*10.0/nullif(total_count,0),2)
  ) order by code),'[]'::jsonb)
  into v_clos from (
    select coalesce(aq.clo_code,'—') code,count(*) total_count,count(*) filter(where sa.is_correct) correct_count
    from public.attempt_questions aq
    left join public.student_answers sa on sa.attempt_id=p_attempt_id and sa.question_id=aq.question_id
    where aq.attempt_id=p_attempt_id group by aq.clo_code
  ) z;

  select coalesce(jsonb_agg(jsonb_build_object(
    'chapter',chapter_name,'correct',correct_count,'total',total_count,
    'score',round(correct_count*10.0/nullif(total_count,0),2)
  ) order by chapter_name),'[]'::jsonb)
  into v_chapters from (
    select coalesce(aq.chapter_name,'—') chapter_name,count(*) total_count,count(*) filter(where sa.is_correct) correct_count
    from public.attempt_questions aq
    left join public.student_answers sa on sa.attempt_id=p_attempt_id and sa.question_id=aq.question_id
    where aq.attempt_id=p_attempt_id group by aq.chapter_name
  ) z;

  v_staff:=public.is_admin() or public.is_subject_teacher(v_exam.subject_id);
  v_can_answers:=v_staff or coalesce(v_exam.show_answers,false);
  v_can_review:=v_staff or coalesce(v_exam.show_review,false) or coalesce(v_exam.show_answers,false);

  if v_can_review then
    select coalesce(jsonb_agg(jsonb_build_object(
      'question_id',aq.question_id,
      'content',aq.content,
      'selected',sa.selected_option,
      'is_correct',coalesce(sa.is_correct,false),
      'options',aq.options,
      'clo_code',aq.clo_code,
      'chapter',aq.chapter_name,
      'topic',aq.topic_name,
      -- Never send answer/explanation to a student in review-only mode.
      'correct_answer',case when v_can_answers then aq.correct_answer else null end,
      'explanation',case when v_can_answers then aq.explanation else null end
    ) order by aq.question_order),'[]'::jsonb)
    into v_review
    from public.attempt_questions aq
    left join public.student_answers sa on sa.attempt_id=p_attempt_id and sa.question_id=aq.question_id
    where aq.attempt_id=p_attempt_id;
  else
    v_review:='[]'::jsonb;
  end if;

  return jsonb_build_object(
    'attempt_id',v_attempt.id,
    'exam_id',v_attempt.exam_id,
    'subject_id',v_exam.subject_id,
    'student_id',v_attempt.student_id,
    'attempt_number',v_attempt.attempt_number,
    'score',v_attempt.score,
    'correct',coalesce(v_correct,0),
    'total',coalesce(v_total,0),
    'submitted_at',v_attempt.submitted_at,
    'clo_scores',coalesce(v_clos,'[]'::jsonb),
    'chapter_scores',coalesce(v_chapters,'[]'::jsonb),
    'review',coalesce(v_review,'[]'::jsonb),
    'show_review',v_can_review,
    'show_answers',v_can_answers,
    'allow_ai_feedback',coalesce(v_exam.allow_ai_feedback,true)
  );
end;
$$;

grant execute on function public.get_attempt_result(uuid) to authenticated;

create or replace function public.assessment_schema_version()
returns text language sql stable security definer set search_path=public,pg_temp
as $$ select '12.3.1'::text $$;
grant execute on function public.assessment_schema_version() to authenticated;

commit;

select 'ASSESSMENT_V12_3_1_REVIEW_AI_OK' as trang_thai,
       count(*) filter(where show_review) as bai_cho_xem_lai,
       count(*) filter(where show_answers) as bai_hien_dap_an,
       count(*) filter(where allow_ai_feedback) as bai_cho_ai
from public.exams;
'''
          Path('docs/assessment-v12.3.1-review-ai.sql').write_text(mig, encoding='utf-8')

          # 2) Builder: two review levels.
          p=Path('js/assessment/online-builder.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('show_answers: !!exam?.show_answers,', 'show_review: !!exam?.show_review || !!exam?.show_answers,\n            show_answers: !!exam?.show_answers,', 1)
          old='<label><input type="checkbox" data-v122-check="show_answers" ${s.show_answers ? "checked" : ""}> Cho xem đáp án sau khi nộp</label>'
          new='<label><input type="checkbox" data-v122-check="show_review" ${s.show_review ? "checked" : ""}> Cho xem lại bài và biết đúng/sai</label><label><input type="checkbox" data-v122-check="show_answers" ${s.show_answers ? "checked" : ""} ${s.show_review ? "" : "disabled"}> Hiện đáp án đúng và lời giải</label>'
          assert old in s, 'builder review checkbox anchor missing'
          s=s.replace(old,new,1)
          oldbind='''        qsa("[data-v122-check]", c).forEach(\n          (el) =>\n            (el.onchange = () => (ctx.settings[el.dataset.v122Check] = el.checked)),\n        );'''
          newbind='''        qsa("[data-v122-check]", c).forEach(\n          (el) =>\n            (el.onchange = () => {\n              const key = el.dataset.v122Check;\n              ctx.settings[key] = el.checked;\n              if (key === "show_review" && !el.checked) ctx.settings.show_answers = false;\n              if (key === "show_answers" && el.checked) ctx.settings.show_review = true;\n              if (key === "show_review" || key === "show_answers") renderBuilder(ctx);\n            }),\n        );'''
          assert oldbind in s, 'builder checkbox binding anchor missing'
          s=s.replace(oldbind,newbind,1)
          s=s.replace('show_answers: !!ctx.settings.show_answers,', 'show_review: !!ctx.settings.show_review,\n            show_answers: !!ctx.settings.show_answers,', 1)
          p.write_text(s,encoding='utf-8')

          # 3) Student/result renderer: review-only never prints answers, add explicit attempt AI action.
          p=Path('js/assessment/student-attempt.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const { db, state, fetchExams, statusMeta, escapeHtml, qs, qsa, ask, showError, notify, openDrawer, replaceDrawer } = ctx;', 'const { db, state, subjectId, fetchExams, statusMeta, escapeHtml, qs, qsa, ask, showError, notify, openDrawer, replaceDrawer } = ctx;', 1)
          s=s.replace('if (!db || !state || !fetchExams || !statusMeta', 'if (!db || !state || !subjectId || !fetchExams || !statusMeta', 1)
          start=s.index('      function studentResultHtml(result) {')
          end=s.index('      function showStudentResult(exam, result) {', start)
          replacement=r'''      function attemptAiAnalysisHtml(a) {
        const actions = a?.recommendations || a?.next_actions || [];
        return `<div class="ai-analysis-v122"><p>${escapeHtml(a?.summary || "")}</p>${a?.strengths?.length ? `<h4>Điểm mạnh</h4><ul>${a.strengths.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""}${a?.needs_improvement?.length ? `<h4>Cần cải thiện</h4><ul>${a.needs_improvement.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""}${actions.length ? `<h4>Khuyến nghị</h4><ul>${actions.map((x) => `<li>${escapeHtml(x)}</li>`).join("")}</ul>` : ""}</div>`;
      }
      async function requestAttemptAi(attemptId, button) {
        const old = button?.textContent;
        if (button) {
          button.disabled = true;
          button.textContent = "✦ Đang nhận xét…";
        }
        try {
          const { data, error } = await db.functions.invoke("analyze-assessment", {
            body: { subject_id: subjectId(), scope: "attempt", attempt_id: attemptId },
          });
          if (error) throw error;
          if (!data?.success) throw new Error(data?.error || "AI chưa tạo được nhận xét");
          const out = qs(`[data-v123-ai-output="${attemptId}"]`);
          if (out) out.innerHTML = attemptAiAnalysisHtml(data.analysis);
          else notify("AI đã tạo nhận xét nhưng vùng kết quả không còn mở.");
        } catch (e) {
          showError(e);
        } finally {
          if (button) {
            button.disabled = false;
            button.textContent = old;
          }
        }
      }
      function studentResultHtml(result) {
        const reviewAllowed = !!result.show_review;
        const answersAllowed = !!result.show_answers;
        const detail = reviewAllowed && result.review?.length
          ? `<h4>Chi tiết bài làm</h4><div class="answer-review">${result.review.map((x, i) => `<details class="${x.is_correct ? "right" : "wrong"}"><summary>Câu ${i + 1} — ${x.is_correct ? "Đúng" : "Chưa đúng"} · ${escapeHtml(x.clo_code || "")}</summary><div>${escapeHtml(x.content || "")}</div><p>Bạn chọn: <b>${escapeHtml(x.selected || "Chưa trả lời")}</b>${answersAllowed ? ` · Đáp án đúng: <b>${escapeHtml(x.correct_answer || "")}</b>` : ""}</p>${answersAllowed && x.explanation ? `<p>${escapeHtml(x.explanation)}</p>` : ""}</details>`).join("")}</div>`
          : '<p class="hint">Giảng viên chưa cho phép xem lại chi tiết bài làm.</p>';
        const ai = result.allow_ai_feedback && result.attempt_id
          ? `<div class="result-ai-actions"><button type="button" class="ai-btn" data-v123-ai-attempt="${escapeHtml(result.attempt_id)}">✦ AI nhận xét bài làm</button></div><div data-v123-ai-output="${escapeHtml(result.attempt_id)}"></div>`
          : "";
        return `<div class="preview-result result-v122"><div class="result-score"><small>Điểm tổng</small><b>${Number(result.score || 0).toFixed(2)}</b><span>${Number(result.correct || 0)}/${Number(result.total || 0)} câu đúng</span></div><h4>Kết quả theo CLO</h4><div class="clo-results">${(result.clo_scores || []).map((x) => `<div><b>${escapeHtml(x.code || "CLO")}</b><strong>${Number(x.score || 0).toFixed(2)}</strong><span>${x.correct}/${x.total} câu đúng</span></div>`).join("") || "<p>Chưa có dữ liệu CLO.</p>"}</div>${ai}${detail}</div>`;
      }
      document.addEventListener("click", (event) => {
        const button = event.target?.closest?.("[data-v123-ai-attempt]");
        if (!button) return;
        const attemptId = button.dataset.v123AiAttempt;
        if (attemptId) requestAttemptAi(attemptId, button);
      });
'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')

          # 4) Owner requires new schema and gives Student Attempt subject context.
          p=Path('js/assessment.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const VERSION = "12.3.0";', 'const VERSION = "12.3.1";', 1)
          s=s.replace('return String(data || "") === "12.2";', 'return String(data || "") === "12.3.1";', 1)
          s=s.replace('''c.innerHTML = `<div class="panel migration-panel"><h3>Cần hoàn tất Assessment V12.2 trên Supabase</h3><p>Frontend V12.2 chỉ chạy khi backend contract 12.2 đã được cài.</p><ol><li>Mở <b>Supabase → SQL Editor</b>.</li><li>Chạy <code>docs/assessment-v12.2-migration.sql</code>.</li><li>Tải lại trang.</li></ol></div>`;''', '''c.innerHTML = `<div class="panel migration-panel"><h3>Cần hoàn tất Assessment V12.3.1 trên Supabase</h3><p>Phiên bản này tách quyền xem lại bài và quyền hiện đáp án đúng.</p><ol><li>Mở <b>Supabase → SQL Editor</b>.</li><li>Chạy <code>docs/assessment-v12.3.1-review-ai.sql</code>.</li><li>Tải lại trang.</li></ol></div>`;''', 1)
          anchor='''    db,\n    state,\n    fetchExams,'''
          assert anchor in s, 'student module owner anchor missing'
          s=s.replace(anchor, '''    db,\n    state,\n    subjectId,\n    fetchExams,''', 1)
          p.write_text(s,encoding='utf-8')

          # 5) Normalize all seven Assessment cache keys.
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          files=['common','online-lifecycle','online-builder','student-attempt','results','final-exam']
          for name in files:
            s=re.sub(rf'js/assessment/{re.escape(name)}\.js\?v=[^\"]+', f'js/assessment/{name}.js?v=12.3.1', s)
          s=re.sub(r'js/assessment\.js\?v=[^\"]+', 'js/assessment.js?v=12.3.1', s)
          p.write_text(s,encoding='utf-8')
          PY

          node --check js/assessment.js
          node --check js/assessment/online-builder.js
          node --check js/assessment/student-attempt.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.html').read_text()
          refs=re.findall(r'js/assessment(?:/[^"?]+)?\.js\?v=([^" ]+)',app)
          assert len(refs)==7, refs
          assert set(refs)=={'12.3.1'}, refs
          owner=Path('js/assessment.js').read_text()
          assert '=== "12.3.1"' in owner
          assert 'subjectId,\n    fetchExams' in owner
          stu=Path('js/assessment/student-attempt.js').read_text()
          assert 'scope: "attempt"' in stu
          assert 'result.show_review' in stu
          assert 'answersAllowed' in stu
          assert 'data-v123-ai-attempt' in stu
          b=Path('js/assessment/online-builder.js').read_text()
          assert 'show_review' in b and 'Hiện đáp án đúng và lời giải' in b
          sql=Path('docs/assessment-v12.3.1-review-ai.sql').read_text()
          assert "case when v_can_answers then aq.correct_answer else null end" in sql
          assert "select '12.3.1'::text" in sql
          print('V12.3.1 review/AI static guards: PASS')
          PY

          rm .github/workflows/v12.3.1-review-ai-once.yml
          git config user.name 'AI-CLO V12.3.1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(assessment): split review permissions and enable attempt AI feedback'
          git push origin HEAD:v12.3.1-result-ai-review
